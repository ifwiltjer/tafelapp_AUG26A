<!doctype html>
<html lang="nl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rekenen Tafel-app</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
        <style>
    body {
        background-image: url("animal-print.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        min-height: 100vh;
    }
</style>
</head>

<body>
    <div class="container mt-4">
        <div class="row g-4">
            <!-- Kaart 1: Tafelapp -->
            <div class="col-md-5">
                <div class="card text-center">
                    <div class="card-header fw-bold">
                        Tafelapp
                    </div>
                    <div class="card-body">
                        <div class="row g-2 align-items-center justify-content-center">
                            <div class="col-auto">
                                <label for="inputTafel" class="col-form-label">De tafel van</label>
                            </div>
                            <div class="col-3">
                                <input type="number" id="inputTafel" class="form-control">
                            </div>
                            <div class="col-auto">
                                <button type="button" class="btn btn-primary" onclick="toonTafel()">Toon de tafel</button>
                            </div>
                        </div>
                        <div id="outputTafel"></div>
                    </div>
                    <div class="card-footer text-body-secondary">
                        Made by Ilse
                    </div>
                </div>
            </div>

            <!-- Kaart 2: Tafel-oefenapp -->
            <div class="col-md-5">
                <div class="card text-center">
                    <div class="card-header fw-bold">
                        Tafel-oefenapp
                    </div>
                    <div class="card-body">
                        <div class="row g-2 align-items-center justify-content-center">
                            <div class="col-auto">
                                <label for="inputOefenTafel" class="col-form-label">De tafel van</label>
                            </div>
                            <div class="col-3">
                                <input type="number" id="inputOefenTafel" class="form-control">
                            </div>
                            <div class="col-auto">
                                <button type="button" class="btn btn-primary" onclick="toonOpgave()">GO</button>
                            </div>
                        </div>

                        <div class="row g-2 mt-3 align-items-center justify-content-center">
                            <div class="col-auto" id="outputOefenTafel">
                                <span class="text-muted">Klik op GO</span>
                            </div>
                            <div class="col-3">
                                <input type="number" id="inputAntwOefenTafel" class="form-control">
                            </div>
                            <div class="col-auto">
                                <button type="button" class="btn btn-success" onclick="controleerAntw()">CHECK</button>
                            </div>
                        </div>
                        <div id="feedbackOefenTafel" class="mt-3"></div>
                    </div>
                    <div class="card-footer text-body-secondary">
                        Made by Ilse
                    </div>
                </div>
            </div>

            <!-- Derde kolom -->
            <div class="col-md-2"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        let juistAntwoord = null;

        // Functie 1: Toon de volledige tafel
        function toonTafel() {
            const tafel = parseInt(document.getElementById("inputTafel").value);
            const output = document.getElementById("outputTafel");

            if (isNaN(tafel)) {
                output.innerHTML = '<div class="alert alert-warning mt-3 mb-0">Vul eerst een getal in!</div>';
                return;
            }

            let tekst = '<ul class="list-group list-group-flush mt-3">';
            for (let i = 1; i <= 10; i++) {
                tekst += `<li class="list-group-item">${i} &times; ${tafel} = <strong>${i * tafel}</strong></li>`;
            }
            tekst += '</ul>';
            output.innerHTML = tekst;
        }

        // Functie 2: Maak een nieuwe oefensom
        function toonOpgave() {
            const tafel = parseInt(document.getElementById("inputOefenTafel").value);
            const output = document.getElementById("outputOefenTafel");
            const antwoordVeld = document.getElementById("inputAntwOefenTafel");
            const feedback = document.getElementById("feedbackOefenTafel");

            if (isNaN(tafel)) {
                feedback.innerHTML = '<div class="alert alert-warning mb-0">Vul eerst een tafelgetal in!</div>';
                return;
            }

            const getal = Math.floor(Math.random() * 10) + 1;
            juistAntwoord = getal * tafel;

            output.innerHTML = `<span class="fs-5 fw-bold">${getal} &times; ${tafel} =</span>`;
            antwoordVeld.value = "";
            antwoordVeld.classList.remove("is-valid", "is-invalid");
            feedback.innerHTML = "";
            antwoordVeld.focus();
        }

        // Functie 3: Controleer het antwoord
        function controleerAntw() {
            const antwoordVeld = document.getElementById("inputAntwOefenTafel");
            const feedback = document.getElementById("feedbackOefenTafel");
            const gegevenAntwoord = parseInt(antwoordVeld.value);

            if (juistAntwoord === null) {
                feedback.innerHTML = '<div class="alert alert-warning mb-0">Klik eerst op GO!</div>';
                return;
            }

            if (isNaN(gegevenAntwoord)) {
                feedback.innerHTML = '<div class="alert alert-warning mb-0">Vul eerst je antwoord in!</div>';
                return;
            }

            if (gegevenAntwoord === juistAntwoord) {
                antwoordVeld.classList.remove("is-invalid");
                antwoordVeld.classList.add("is-valid");
                feedback.innerHTML = '<div class="alert alert-success mb-0">Goed gedaan!</div>';
            } else {
                antwoordVeld.classList.remove("is-valid");
                antwoordVeld.classList.add("is-invalid");
                feedback.innerHTML = `<div class="alert alert-danger mb-0">Pipo, het juiste antwoord was <strong>${juistAntwoord}</strong>.</div>`;
            }
        }

        // Enter-toets ondersteuning voor het antwoordveld
        document.getElementById("inputAntwOefenTafel").addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                controleerAntw();
            }
        });
    </script>
</body>

</html>
